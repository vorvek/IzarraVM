[workspace]
resolver = "2"
members = [
    "crates/izarravm",
    "crates/izarravm-audio",
    "crates/izarravm-bus",
    "crates/izarravm-cdaudio",
    "crates/izarravm-core",
    "crates/izarravm-corpus",
    "crates/izarravm-cpu",
    "crates/izarravm-exodos",
    "crates/izarravm-firmware",
    "crates/izarravm-input",
    "crates/izarravm-machine",
    "crates/izarravm-native-synth",
    "crates/izarravm-video",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
repository = "https://github.com/vorvek/IzarraVM"
authors = ["IzarraVM contributors"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
# Line-table debug info (MSVC: richer PDB, identical codegen) so the
# IZARRAVM_RIP_PROFILE sampler attributes wall to real functions and lines.
# The publics-only PDB the stripped build produced attributed 25% of a
# nascar-586 profile to a nearest-public btree drop-glue symbol.
debug = "line-tables-only"
strip = "none"

[workspace.dependencies]
bitflags = "2.6"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.15"
crossbeam-queue = "0.3"
gilrs = "0.11"
midir = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = "0.32"
egui_extras = { version = "0.32", default-features = false, features = ["svg"] }
egui-winit = "0.32"
egui-wgpu = { version = "0.32", features = ["winit"] }
pollster = "0.4"
png = "0.17"
rfd = "0.15"
softbuffer = "0.4.8"
# Default features pull in Matroska, AIFF, ADPCM and more; this is only the
# four containers a CUE sheet realistically names for a CD-DA track.
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac",
    "id3v1",
    "id3v2",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
tempfile = "3.10"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
wgpu = "25"
winit = "0.30"

# Temporary: release codegen with symbols for the riprofile sampler.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
