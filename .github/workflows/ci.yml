name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 140

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: File policy
        run: python scripts/check_file_policy.py

      # tokados-hdd.img is a build product of ~30 committed binaries plus a
      # LICENSE.TXT generated from NOTICE and the kernel COPYING. Editing NOTICE
      # staled the shipped attribution once already (the Cranelift credit
      # outlived the dependency by 465 commits) and because every file after
      # LICENSE.TXT then moves a cluster, it reads as 323 KB of mystery drift to
      # the next person who rebuilds. Rebuilds nothing, just proves the image
      # still matches its inputs.
      - name: Disk image is reproducible
        run: python scripts/build-freedos-hdd-image.py --check

      # Rebuilds every NASM guest binary and compares it with the committed file.
      # The NASM version and the zip hash are pinned: other NASM versions can
      # emit other bytes. The cache key holds the hash, so the download runs
      # only on a cache miss.
      - name: Cache NASM
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nasm
          key: nasm-3.01-e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4

      - name: Guest binaries match their sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dir = Join-Path $env:RUNNER_TEMP 'nasm'
          if ('${{ steps.nasm-cache.outputs.cache-hit }}' -ne 'true') {
            $sha = 'e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4'
            $zip = Join-Path $env:RUNNER_TEMP 'nasm-3.01-win64.zip'
            Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip' -OutFile $zip
            $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "NASM zip hash mismatch: $got" }
            New-Item -ItemType Directory -Force $dir | Out-Null
            Expand-Archive $zip -DestinationPath $dir -Force
          }
          $exe = Get-ChildItem -Path $dir -Recurse -Filter nasm.exe | Select-Object -First 1
          if (-not $exe) { throw 'nasm.exe not found' }
          $exe.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$($exe.DirectoryName);$env:PATH"
          python scripts/check_guest_binaries.py

      - name: Policy self-checks
        shell: pwsh
        run: |
          # Every line below is a cargo invocation that must gate the build on its own exit
          # code. Without these two settings, pwsh only propagates the LAST command's
          # $LASTEXITCODE to the step (a failing native command does not stop a pwsh script
          # by default), so a red cargo check or test partway down this block would pass
          # silently and only the final clippy call would actually gate CI. That happened:
          # PR #787 and PR #796 both landed with stale fixtures this block runs, and the
          # step stayed green through both because nothing upstream of the last line could
          # fail it.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check -p izarravm --no-default-features
          # int-trace is off by default, so the workspace clippy/test steps below
          # compile neither the tracer nor its tests. The check proves the feature
          # still wires up through izarravm; the test proves the module still works,
          # and is what stops a rename of parse_vectors from leaving int_trace_test.rs
          # uncompiled behind a green CI. `cargo check` alone builds no test target.
          cargo check -p izarravm --features int-trace
          cargo test -p izarravm-cpu --features int-trace int_trace
          cargo check -p izarravm --features watch-write
          cargo check -p izarravm --features timing-class-histogram
          cargo check -p izarravm --no-default-features --features direct-admission-census
          cargo test -p izarravm-cpu --no-default-features --features direct-admission-census admission_census
          cargo test -p izarravm --no-default-features --features direct-admission-census direct_barrier_census_json_exposes_ordered_zero_admission_declines
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-admission-census -- -D warnings
          cargo check -p izarravm --no-default-features --features direct-link-refusal-census
          cargo test -p izarravm-cpu --no-default-features --features direct-link-refusal-census link_refusal
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census direct_link_refusal_census_json
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-link-refusal-census -- -D warnings
          cargo check -p izarravm --no-default-features --features barrier-census-closure
          cargo test -p izarravm-cpu --no-default-features --features barrier-census-closure barrier_census_closure
          cargo test -p izarravm --no-default-features --features barrier-census-closure direct_barrier_census_json
          cargo test -p izarravm --no-default-features direct_barrier_census_json_omits_the_closure_block_without_feature
          cargo test -p izarravm --no-default-features --features barrier-census-closure hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features barrier-census-closure -- -D warnings
          cargo check -p izarravm --no-default-features --features direct-callout-attribution
          cargo test -p izarravm-cpu --no-default-features --features direct-callout-attribution callout_attribution
          cargo test -p izarravm --no-default-features --features direct-callout-attribution direct_callout_attribution_json
          cargo test -p izarravm --no-default-features --features direct-callout-attribution hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-callout-attribution -- -D warnings
          # The entry-attribution observer. Same trio as the censuses above: the check proves the
          # feature still wires through izarravm, the targeted test proves the module and its
          # fixtures still compile and pass (the workspace test step below builds NEITHER, since
          # the feature is off by default), and clippy proves the armed arm is warning-clean. The
          # `run.rs`-parsing fixture in the cpu test is the one that matters most here: it is what
          # stops the refusal/compile line-number tables going stale behind a green CI.
          cargo check -p izarravm --no-default-features --features direct-entry-attribution
          cargo test -p izarravm-cpu --no-default-features --features direct-entry-attribution entry_attribution
          # The line-table rot fixture lives in `jit::direct::armed_tests`, not under
          # `tests::entry_attribution::`: the module is nested under `jit::direct` while the
          # file lives in `entry_attribution/`, so the filter above is a substring match that
          # never selects it. This is the second, independent filter for that module; it must
          # stay separate because the test harness takes one filter string per invocation.
          cargo test -p izarravm-cpu --no-default-features --features direct-entry-attribution armed_tests
          cargo test -p izarravm --no-default-features --features direct-entry-attribution hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-entry-attribution -- -D warnings
          cargo check -p izarravm --no-default-features --features smc-census
          cargo test -p izarravm-cpu --no-default-features --features smc-census smc_census
          cargo test -p izarravm --no-default-features --features smc-census hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features smc-census -- -D warnings
          # Slice 0b of the reflected-call HLE design's trip-shape instrument. Off by
          # default, so the workspace test/clippy steps below build neither the module
          # nor its tests; this quartet proves the feature still wires through izarravm
          # AND izarravm-machine (0b's one machine-crate hook, the batch-straddle
          # counter), every test in reflected_call_diag_test.rs still passes, and the
          # armed arm is warning-clean end to end.
          cargo check -p izarravm --no-default-features --features reflected-call-diagnostic
          cargo check -p izarravm-machine --no-default-features --features reflected-call-diagnostic
          cargo test -p izarravm-cpu --no-default-features --features reflected-call-diagnostic reflected_call_diag
          cargo clippy -p izarravm-cpu -p izarravm -p izarravm-machine --all-targets --no-default-features --features reflected-call-diagnostic -- -D warnings
          # S1a/b/c/d of the S2 cache-differentiation design's shadow-cache probe. Off by
          # default (`IZARRAVM_SHADOW_L1_PROBE`/`IZARRAVM_SHADOW_PROBE_SAMPLE` are inert without
          # this feature), so the plain build below compiles NEITHER the persona-geometry/L2
          # module (`shadow_cache_probe.rs`) NOR the entry-sampling hook: it stays on
          # `shadow_cache.rs`, byte-identical to pre-S1a main. This block proves the feature
          # wires through izarravm-bus (the CpuBus sampling hook) -> izarravm-cpu (the entry-
          # diversion site in run.rs, including the izarravm-cpu-side test that the diversion
          # returns NotRun and bumps jit_direct_reject_shadow_sample) -> izarravm-machine (the
          # probe itself) -> izarravm, every shadow_cache test passes armed, and the armed arm
          # is warning-clean end to end.
          cargo check -p izarravm --no-default-features --features shadow-cache-probe
          cargo check -p izarravm-machine --no-default-features --features shadow-cache-probe
          cargo test -p izarravm-machine --no-default-features --features shadow-cache-probe shadow_cache
          cargo test -p izarravm-cpu --no-default-features --features shadow-cache-probe direct_self_loop_entry_rejects_interrupt_shadow_and_segment_preconditions
          cargo clippy -p izarravm-cpu -p izarravm -p izarravm-machine --all-targets --no-default-features --features shadow-cache-probe -- -D warnings
          # Slice 1 of the reflected-call HLE design's record-and-measure memo. Off by
          # default (gated under its own feature, not merely the
          # runtime knob, so the plain build carries none of it); this quartet proves the
          # feature still wires through izarravm AND izarravm-machine, every test in
          # reflected_call_memo_test.rs still passes, and the armed arm is warning-clean.
          cargo check -p izarravm --no-default-features --features reflected-call-memo
          cargo check -p izarravm-machine --no-default-features --features reflected-call-memo
          cargo test -p izarravm-cpu --no-default-features --features reflected-call-memo reflected_call_memo
          cargo clippy -p izarravm-cpu -p izarravm -p izarravm-machine --all-targets --no-default-features --features reflected-call-memo -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # riprofile_test walks target/release/izarravm.exe via dbghelp. cargo
      # test --workspace used to pass that test as a silent no-op; it now
      # requires the shipped binary. Build it before Test so CI matches the
      # house gate after a local `cargo build --release -p izarravm`.
      - name: Release binary
        run: cargo build --profile release -p izarravm

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

      - name: Check configuration
        run: cargo run -p izarravm -- --headless-config-check

      - name: Run test ROM
        run: cargo run -p izarravm -- --headless-test-rom

      - name: Run boot suite
        run: cargo run -p izarravm -- --headless-boot-suite

      - name: Run Izarra BIOS POST
        run: cargo run -p izarravm -- --headless-izarra-bios

  # Runs the Toka-DOS tests marked "slow in debug" in a release build, on pushes to main only.
  slow-tests:
    name: slow-tests
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: slow-tests-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Slow tests
        run: cargo test --release -p izarravm -- --ignored

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.22.0
      DENY_SHA256: 98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786
      ABOUT_VERSION: 0.9.3
      ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # cargo-deny reads cargo metadata, which uses the pinned toolchain from
      # rust-toolchain.toml. The minimal profile is enough, because nothing is
      # built.
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal

      # The release binary is checked against its published SHA-256, so the
      # job runs the same cargo-deny version as a local run.
      - name: Install cargo-deny
        run: |
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}"
          echo "${DENY_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Licenses, bans and sources
        run: cargo deny --locked check licenses bans sources

      # A new RustSec advisory can make this step fail on a pull request that
      # does not change any dependency. It is a separate step, so the cause is
      # clear.
      - name: Advisories
        run: cargo deny --locked check advisories

      - name: Install cargo-about
        run: |
          archive="cargo-about-${ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$archive"             "https://github.com/EmbarkStudios/cargo-about/releases/download/${ABOUT_VERSION}/${archive}"
          echo "${ABOUT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP"

      # --frozen reads only the crate sources that cargo-deny fetched above.
      # --fail stops the run when a crate's license text is not found, so the
      # listing never falls back to a generic text without a copyright line.
      - name: Rust crate licenses
        run: >-
          cargo about generate --frozen --fail --threshold 0.93 --all-features
          about.hbs -o rust-crate-licenses.txt

      - name: Upload the Rust crate licenses
        uses: actions/upload-artifact@v4
        with:
          name: rust-crate-licenses
          path: rust-crate-licenses.txt
