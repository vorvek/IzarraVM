name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: File policy
        run: python scripts/check_file_policy.py

      # tokados-hdd.img is a build product of ~30 committed binaries plus a
      # LICENSE.TXT generated from NOTICE and the kernel COPYING. Editing NOTICE
      # staled the shipped attribution once already -- the Cranelift credit
      # outlived the dependency by 465 commits -- and because every file after
      # LICENSE.TXT then moves a cluster, it reads as 323 KB of mystery drift to
      # the next person who rebuilds. Rebuilds nothing, just proves the image
      # still matches its inputs.
      - name: Disk image is reproducible
        run: python scripts/build-freedos-hdd-image.py --check

      - name: Policy self-checks
        shell: pwsh
        run: |
          # Every line below is a cargo invocation that must gate the build on its own exit
          # code. Without these two settings, pwsh only propagates the LAST command's
          # $LASTEXITCODE to the step (a failing native command does not stop a pwsh script
          # by default), so a red cargo check or test partway down this block would pass
          # silently and only the final clippy call would actually gate CI. That happened:
          # PR #787 and PR #796 both landed with stale fixtures this block runs, and the
          # step stayed green through both because nothing upstream of the last line could
          # fail it.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check -p izarravm --no-default-features
          # int-trace is off by default, so the workspace clippy/test steps below
          # compile neither the tracer nor its tests. The check proves the feature
          # still wires up through izarravm; the test proves the module still works,
          # and is what stops a rename of parse_vectors from leaving int_trace_test.rs
          # uncompiled behind a green CI. `cargo check` alone builds no test target.
          cargo check -p izarravm --features int-trace
          cargo test -p izarravm-cpu --features int-trace int_trace
          cargo check -p izarravm --no-default-features --features direct-admission-census
          cargo test -p izarravm-cpu --no-default-features --features direct-admission-census admission_census
          cargo test -p izarravm --no-default-features --features direct-admission-census direct_barrier_census_json_exposes_ordered_zero_admission_declines
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-admission-census -- -D warnings
          cargo check -p izarravm --no-default-features --features direct-link-refusal-census
          cargo test -p izarravm-cpu --no-default-features --features direct-link-refusal-census link_refusal
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census direct_link_refusal_census_json
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-link-refusal-census -- -D warnings
          cargo check -p izarravm --no-default-features --features barrier-census-closure
          cargo test -p izarravm-cpu --no-default-features --features barrier-census-closure barrier_census_closure
          cargo test -p izarravm --no-default-features --features barrier-census-closure direct_barrier_census_json
          cargo test -p izarravm --no-default-features direct_barrier_census_json_omits_the_closure_block_without_feature
          cargo test -p izarravm --no-default-features --features barrier-census-closure hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features barrier-census-closure -- -D warnings
          cargo check -p izarravm --no-default-features --features direct-callout-attribution
          cargo test -p izarravm-cpu --no-default-features --features direct-callout-attribution callout_attribution
          cargo test -p izarravm --no-default-features --features direct-callout-attribution direct_callout_attribution_json
          cargo test -p izarravm --no-default-features --features direct-callout-attribution hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-callout-attribution -- -D warnings
          # The entry-attribution observer. Same trio as the censuses above: the check proves the
          # feature still wires through izarravm, the targeted test proves the module and its
          # fixtures still compile and pass (the workspace test step below builds NEITHER, since
          # the feature is off by default), and clippy proves the armed arm is warning-clean. The
          # `run.rs`-parsing fixture in the cpu test is the one that matters most here: it is what
          # stops the refusal/compile line-number tables going stale behind a green CI.
          cargo check -p izarravm --no-default-features --features direct-entry-attribution
          cargo test -p izarravm-cpu --no-default-features --features direct-entry-attribution entry_attribution
          # The line-table rot fixture lives in `jit::direct::armed_tests`, not under
          # `tests::entry_attribution::` -- the module is nested under `jit::direct` while the
          # file lives in `entry_attribution/`, so the filter above is a substring match that
          # never selects it. This is the second, independent filter for that module; it must
          # stay separate because the test harness takes one filter string per invocation.
          cargo test -p izarravm-cpu --no-default-features --features direct-entry-attribution armed_tests
          cargo test -p izarravm --no-default-features --features direct-entry-attribution hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-entry-attribution -- -D warnings
          cargo check -p izarravm --no-default-features --features smc-census
          cargo test -p izarravm-cpu --no-default-features --features smc-census smc_census
          cargo test -p izarravm --no-default-features --features smc-census hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features smc-census -- -D warnings
          # Slice 0 of the reflected-call HLE design's trip-shape instrument. Off by
          # default, so the workspace test/clippy steps below build neither the module
          # nor its two tests; this trio proves the feature still wires through izarravm,
          # both tests in reflected_call_diag_test.rs still pass, and the armed arm is
          # warning-clean.
          cargo check -p izarravm --no-default-features --features reflected-call-diagnostic
          cargo test -p izarravm-cpu --no-default-features --features reflected-call-diagnostic reflected_call_diag
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features reflected-call-diagnostic -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # riprofile_test walks target/release/izarravm.exe via dbghelp. cargo
      # test --workspace used to pass that test as a silent no-op; it now
      # requires the shipped binary. Build it before Test so CI matches the
      # house gate after a local `cargo build --release -p izarravm`.
      - name: Release binary
        run: cargo build --profile release -p izarravm

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

      - name: Check configuration
        run: cargo run -p izarravm -- --headless-config-check

      - name: Run test ROM
        run: cargo run -p izarravm -- --headless-test-rom

      - name: Run boot suite
        run: cargo run -p izarravm -- --headless-boot-suite
