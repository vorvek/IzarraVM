name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: File policy
        run: python scripts/check_file_policy.py

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

      - name: Check configuration
        run: cargo run -p izarravm -- --headless-config-check

      - name: Run test ROM
        run: cargo run -p izarravm -- --headless-test-rom

      - name: Run boot suite
        run: cargo run -p izarravm -- --headless-boot-suite
