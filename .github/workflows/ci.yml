name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: File policy
        run: python scripts/check_file_policy.py

      # tokados-hdd.img is a build product of ~30 committed binaries plus a
      # LICENSE.TXT generated from NOTICE and the kernel COPYING. Editing NOTICE
      # staled the shipped attribution once already -- the Cranelift credit
      # outlived the dependency by 465 commits -- and because every file after
      # LICENSE.TXT then moves a cluster, it reads as 323 KB of mystery drift to
      # the next person who rebuilds. Rebuilds nothing, just proves the image
      # still matches its inputs.
      - name: Disk image is reproducible
        run: python scripts/build-freedos-hdd-image.py --check

      - name: Policy self-checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/run-fixture-scoreboard.ps1 -SelfTest
          pwsh -NoProfile -File scripts/run-realtime-gate.ps1 -SelfTest
          cargo check -p izarravm --no-default-features
          # int-trace is off by default, so the workspace clippy/test steps below
          # compile neither the tracer nor its tests. The check proves the feature
          # still wires up through izarravm; the test proves the module still works,
          # and is what stops a rename of parse_vectors from leaving int_trace_test.rs
          # uncompiled behind a green CI. `cargo check` alone builds no test target.
          cargo check -p izarravm --features int-trace
          cargo test -p izarravm-cpu --features int-trace int_trace
          cargo check -p izarravm --no-default-features --features direct-admission-census
          cargo test -p izarravm-cpu --no-default-features --features direct-admission-census admission_census
          cargo test -p izarravm --no-default-features --features direct-admission-census direct_barrier_census_json_exposes_ordered_zero_admission_declines
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-admission-census -- -D warnings
          cargo check -p izarravm --no-default-features --features direct-link-refusal-census
          cargo test -p izarravm-cpu --no-default-features --features direct-link-refusal-census link_refusal
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census direct_link_refusal_census_json
          cargo test -p izarravm --no-default-features --features direct-link-refusal-census hdd_profile_json_reports_fixed_time_and_native_metrics
          cargo clippy -p izarravm-cpu -p izarravm --all-targets --no-default-features --features direct-link-refusal-census -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

      - name: Check configuration
        run: cargo run -p izarravm -- --headless-config-check

      - name: Run test ROM
        run: cargo run -p izarravm -- --headless-test-rom

      - name: Run boot suite
        run: cargo run -p izarravm -- --headless-boot-suite
