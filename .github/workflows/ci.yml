name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: File policy
        run: python scripts/check_file_policy.py

      - name: Policy self-checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/run-realtime-gate.ps1 -SelfTest
          cargo check -p izarravm --no-default-features

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        continue-on-error: true

      # TEMPORARY DIAGNOSTICS -- not for merge. The izarravm bin target exits
      # with STATUS_ACCESS_VIOLATION on this runner only, after every test
      # reports ok. Default output interleaves four threads, so nothing
      # identifies what was executing. These steps run regardless of the
      # result above.
      - name: Diag A -- single-threaded, unbuffered, full backtrace
        if: always()
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          cargo test -p izarravm --bin izarravm -- --nocapture --test-threads=1
          Write-Host "DIAG_A_EXIT=$LASTEXITCODE"
          exit 0

      - name: Diag B -- default threads, three attempts, exit code each
        if: always()
        shell: pwsh
        env:
          RUST_BACKTRACE: full
        run: |
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== DIAG_B attempt $i ==="
            cargo test -p izarravm --bin izarravm -- --nocapture
            Write-Host "DIAG_B_ATTEMPT_${i}_EXIT=$LASTEXITCODE"
          }
          exit 0

      - name: Diag C -- runner facts
        if: always()
        shell: pwsh
        run: |
          Write-Host "cores=$env:NUMBER_OF_PROCESSORS"
          Write-Host "temp=$env:TEMP"
          rustc --version
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory | Format-List
          exit 0

      - name: Build
        run: cargo build --workspace

      - name: Check configuration
        run: cargo run -p izarravm -- --headless-config-check

      - name: Run test ROM
        run: cargo run -p izarravm -- --headless-test-rom

      - name: Run boot suite
        run: cargo run -p izarravm -- --headless-boot-suite
