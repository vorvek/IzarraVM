[machine]
cpu = "386"
memory_mib = 16
video = "vega"

[dos]
c_drive = "R:\\La Colecci\u00f3n by Neville\\dosroot\\"

[audio]
pc_speaker = true
opl3 = true

[audio.sound_blaster]
enabled = true
irq = "5"
dma = "1"
high_dma = "5"

[audio.midi]
backend = "fluidsynth"
# soundfont = "C:\\SoundFonts\\custom.sf3"
# For an external backend, add an exact saved identity:
# external_port = { name = "USB MIDI", ordinal = 0 }
# Munt also needs mt32_control_rom and mt32_pcm_rom paths.

[input]
keyboard = true
mouse = true
joystick = true
steam_input = "off"

[diagnostics]
trace_devices = false
