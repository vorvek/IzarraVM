# The CPU speed class is NOT here: it lives in the machine's CMOS, set from the
# BIOS setup panel (Del), the Tab boot menu, or GSWMODE inside DOS. A key here
# could only ever disagree with what the machine actually boots at.
[machine]
memory_mib = 16
video = "vega"

[dos]
c_drive = "R:\\La Colecci\u00f3n by Neville\\dosroot\\"

[audio]

# Whether the card is fitted is a property of the machine, so it stays here.
# Its IRQ and DMA channels are not: they live in CMOS, and SNDCTRL in DOS is
# what moves them. Same for [audio.wss], whose `base` stays because the codec's
# I/O window is fixed board wiring rather than a resource anything selects.
[audio.sound_blaster]
enabled = true

[audio.midi]
backend = "off" # P330 receiver: off, external, or munt
# P300 always uses FluidSynth. This optional path replaces the embedded bank.
# soundfont = "C:\\SoundFonts\\custom.sf3"
# For an external P330 receiver, add an exact host destination:
# external_port = { name = "USB MIDI", ordinal = 0 }
# Munt also needs mt32_control_rom and mt32_pcm_rom paths.

[input]
keyboard = true
mouse = true
joystick = true

[diagnostics]
trace_devices = false
