[package]
name = "izarravm-cpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The existing template JIT is the default. `--no-default-features` keeps the interpreter-only
# build for unsupported hosts and differential checks.
default = ["jit"]
jit = []
# Partial Direct admission attribution. The dispatcher hooks are compiled out unless this
# diagnostic feature is selected, then armed with IZARRAVM_DIRECT_BARRIER_CENSUS=1.
direct-admission-census = ["jit"]
# Per-entry Direct attribution observer (dev_docs/specs/2026-08-23-sixteen-bit-entry-attribution-# design.md). Compiled out unless selected -- the `ea_*!` macros expand to nothing -- then armed
# with IZARRAVM_DIRECT_ENTRY_ATTRIBUTION=1 (full) or =2 (coarse), strided by
# IZARRAVM_DIRECT_ENTRY_ATTRIBUTION_SAMPLE=N.
#
# EXCLUDED FROM `default` AND FROM ANY `--all-features` PATH USED FOR PERF GRADING (design L5):
# it stamps rdtsc >=16 times per dispatcher entry, so a graded build must not carry it.
direct-entry-attribution = ["jit"]
# Per-static-cell Direct link refusal census. Compiled out unless selected, then armed with
# IZARRAVM_DIRECT_LINK_REFUSAL_CENSUS=1.
direct-link-refusal-census = ["jit"]
# Closure accounting for the Direct barrier census: the Rejected-row attribution residual and the
# run-total identities, emitted into the census JSON so exact closure is a property of the
# instrument's own output rather than a hand check across two blocks. Armed together with the
# census itself by IZARRAVM_DIRECT_BARRIER_CENSUS=1.
barrier-census-closure = ["jit"]
# Per-helper and per-port Direct call-out attribution. Compiled out unless selected, then armed
# with IZARRAVM_DIRECT_CALLOUT_ATTRIBUTION=1.
direct-callout-attribution = ["jit"]
# Stage A of the SMC census: top-page table, no-kill/killing scan split and the per-phase unit
# counters of the invalidation choke. Compiled out unless selected, then armed with
# IZARRAVM_SMC_CENSUS=1 (window pinned by IZARRAVM_SMC_CENSUS_WINDOW=<start>,<end>).
smc-census = ["jit"]
# Read-only tally of what the poll-loop classifier WOULD answer at each straight-line run
# boundary while the Direct backend owns execution and the real classifier is gated off.
# Compiled out unless selected.
poll-head-probe = ["jit"]
# Diagnostic guest-store watchpoint (IZARRAVM_WATCH_WRITE). OFF by default: the check sits
# on the store hot path, and leaving it compiled in measured ~10% on a 586 16-bit workload
# even while disarmed. Build with `--features watch-write` when hunting a corruption.
watch-write = []
# Guest INT n tracer. Compiled out by default so the INT dispatch path pays
# nothing; build with `--features int-trace` when you need to read a guest's
# conversation with a driver (this is how the TOKAEMM shared-pool defect was
# found). Armed by IZARRAVM_INT_TRACE=<hex vectors, comma separated>.
int-trace = []

[dependencies]
thiserror.workspace = true
izarravm-bus = { path = "../izarravm-bus" }
izarravm-core = { path = "../izarravm-core" }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
