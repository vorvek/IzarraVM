[package]
name = "izarravm-cpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The existing template JIT is the default. `--no-default-features` keeps the interpreter-only
# build for unsupported hosts and differential checks.
default = ["jit"]
jit = []
# Partial Direct admission attribution. The dispatcher hooks are compiled out unless this
# diagnostic feature is selected, then armed with IZARRAVM_DIRECT_BARRIER_CENSUS=1.
direct-admission-census = ["jit"]
# Per-entry Direct attribution observer
# (dev_docs/specs/2026-08-23-sixteen-bit-entry-attribution-design.md). Compiled out unless
# selected -- the `ea_*!` macros expand to nothing -- then armed with
# IZARRAVM_DIRECT_ENTRY_ATTRIBUTION=1 (full) or =2 (coarse), strided by
# IZARRAVM_DIRECT_ENTRY_ATTRIBUTION_SAMPLE=N.
#
# NOT in `default`. It IS in `--all-features`, because cargo has no way for a feature to opt out
# of that flag, and the design's claim that it is "excluded from --all-features" was therefore
# never enforceable. Stating the truth instead: a `--all-features` build CARRIES this instrument,
# and that is acceptable because the instrument is zero-cost while DISARMED -- the knob defaults
# to off, and a disarmed traversal pays one `OnceLock` load and a not-taken branch per stamp site
# rather than an rdtsc. What must never happen is GRADING a wall number on an ARMED build: the
# full arm measured +24.5% on the loader. Grade on plain builds, per the standing rule.
direct-entry-attribution = ["jit"]
# Per-static-cell Direct link refusal census. Compiled out unless selected, then armed with
# IZARRAVM_DIRECT_LINK_REFUSAL_CENSUS=1.
direct-link-refusal-census = ["jit"]
# Closure accounting for the Direct barrier census: the Rejected-row attribution residual and the
# run-total identities, emitted into the census JSON so exact closure is a property of the
# instrument's own output rather than a hand check across two blocks. Armed together with the
# census itself by IZARRAVM_DIRECT_BARRIER_CENSUS=1.
barrier-census-closure = ["jit"]
# Per-helper and per-port Direct call-out attribution. Compiled out unless selected, then armed
# with IZARRAVM_DIRECT_CALLOUT_ATTRIBUTION=1.
direct-callout-attribution = ["jit"]
# Stage A of the SMC census: top-page table, no-kill/killing scan split and the per-phase unit
# counters of the invalidation choke. Compiled out unless selected, then armed with
# IZARRAVM_SMC_CENSUS=1 (window pinned by IZARRAVM_SMC_CENSUS_WINDOW=<start>,<end>).
smc-census = ["jit"]
# Stage 0 of the V86/real-mode far-return slice: the RETF TARGET-ARITY census
# (dev_docs/specs/2026-08-24-v86-retf-pic-design.md, §5.0a). THROWAWAY -- it exists to
# pre-register the two-cell PIC's yield before the ladder and does not ship. Compiled out unless
# selected, then armed with IZARRAVM_RETF_ARITY_CENSUS=1. It sits on the interpreter's 0xCA/0xCB
# arm, which is 274 M executions per wolf3d run, so both gates are load-bearing.
retf-arity-census = ["jit"]
# Read-only tally of what the poll-loop classifier WOULD answer at each straight-line run
# boundary while the Direct backend owns execution and the real classifier is gated off.
# Compiled out unless selected.
poll-head-probe = ["jit"]
# L9 stage 0: the segment-write head tally
# (dev_docs/2026-08-31-l9-segment-chain-design.md, section 6). THROWAWAY. It answers whether a
# segment-write head's fallthrough successor pins the segment the head just wrote and whether the
# written selector repeats from one entry at that head to the next, which is what picks between the
# refusal design and the guarded-edge design. Compiled out unless selected, so the default entry
# path pays nothing.
seg-head-diagnostic = ["jit"]
# Stage 0 of the segwrite-continue design's own edge design
# (dev_docs/2026-09-01-segwrite-continue-design.md, section 8, row "S0 -- Stage 0, the
# conversion"). THROWAWAY. It extends L9's `written_segments_of` residue to answer the question
# `SEGWRITE-V86-EDGE` needs before it can be built: at each runtime exit from a segment-write
# block, tally per source site whether a block is compiled at the fallthrough linear, whether
# that block's chain requirement claims the written segment, whether the LIVE post-write selector
# equals the target's frozen requirement (the guard's true conversion rate -- the headline number
# section 6.2 of the design calls out as unmeasured), whether the source's own PRE-write
# entry-snapshot selector already matched it, `dirty_multi`, and the source block's terminal kind.
# It decides D1 (a plain refusal) vs D2 (the guarded edge) and does not ship. Compiled out unless
# selected, so the default entry path pays nothing. Like `seg-head-diagnostic` above, it carries
# no separate runtime arm: an armed build counts unconditionally, there is no IZARRAVM_* knob to
# flip, because `note_seg_head_diagnostic`'s only gate is the `#[cfg(feature = ...)]` on its call
# site and this diagnostic mirrors that exactly for consistency.
seg-edge-diagnostic = ["jit"]
# Diagnostic guest-store watchpoint (IZARRAVM_WATCH_WRITE). OFF by default: the check sits
# on the store hot path, and leaving it compiled in measured ~10% on a 586 16-bit workload
# even while disarmed. Build with `--features watch-write` when hunting a corruption.
watch-write = []
# Guest INT n tracer. Compiled out by default so the INT dispatch path pays
# nothing; build with `--features int-trace` when you need to read a guest's
# conversation with a driver (this is how the TOKAEMM shared-pool defect was
# found). Armed by IZARRAVM_INT_TRACE=<hex vectors, comma separated>.
int-trace = []

[dependencies]
thiserror.workspace = true
izarravm-bus = { path = "../izarravm-bus" }
izarravm-core = { path = "../izarravm-core" }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
