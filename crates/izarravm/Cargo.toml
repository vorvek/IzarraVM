[package]
name = "izarravm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Build the binary with native CPU translation. `--no-default-features` keeps an
# interpreter-only build, while the release binary accepts `--interpreter` at launch.
default = ["jit"]
jit = ["izarravm-cpu/jit", "izarravm-machine/jit"]
# Passthrough for the compile-time Direct admission census; see izarravm-cpu.
direct-admission-census = ["jit", "izarravm-cpu/direct-admission-census"]
# Per-entry Direct attribution observer. Not in `default`; IS in `--all-features` (cargo offers no
# opt-out), which is acceptable only because it is zero-cost while disarmed. See the izarravm-cpu
# feature of the same name for the full statement.
direct-entry-attribution = ["jit", "izarravm-cpu/direct-entry-attribution"]
# Passthrough for the per-cell Direct link refusal census; see izarravm-cpu.
direct-link-refusal-census = ["jit", "izarravm-cpu/direct-link-refusal-census"]
# Passthrough for the barrier census closure accounting; see izarravm-cpu. No izarravm-machine
# passthrough: every hook is in izarravm-cpu and every reader is in this crate.
barrier-census-closure = ["jit", "izarravm-cpu/barrier-census-closure"]
# Passthrough for the read-only poll-head probe; see izarravm-cpu.
poll-head-probe = ["jit", "izarravm-cpu/poll-head-probe", "izarravm-machine/poll-head-probe"]
# Passthrough for the Direct call-out attribution diagnostic; see izarravm-cpu.
direct-callout-attribution = ["jit", "izarravm-cpu/direct-callout-attribution"]
# Passthrough for stage A of the SMC census; see izarravm-cpu. No izarravm-machine passthrough:
# every hook is in izarravm-cpu and the only reader is this crate's profile JSON.
smc-census = ["jit", "izarravm-cpu/smc-census"]
# Passthrough for the THROWAWAY stage-0 RETF arity census; see izarravm-cpu. Does not ship.
retf-arity-census = ["jit", "izarravm-cpu/retf-arity-census"]
# Passthrough for the THROWAWAY L9 stage-0 segment-write head tally; see izarravm-cpu. Does not
# ship.
seg-head-diagnostic = ["jit", "izarravm-cpu/seg-head-diagnostic"]
# Passthrough for the store watchpoint; see izarravm-cpu.
watch-write = ["izarravm-cpu/watch-write"]
# Passthrough for the guest INT n tracer; see izarravm-cpu.
int-trace = ["izarravm-cpu/int-trace"]
# Passthrough for the reflected-call HLE design's slice-0 trip-shape
# instrument; see izarravm-cpu.
reflected-call-diagnostic = ["jit", "izarravm-cpu/reflected-call-diagnostic", "izarravm-machine/reflected-call-diagnostic"]
# Passthrough for the S1a/b/c/d shadow-cache probe; see izarravm-machine.
shadow-cache-probe = ["jit", "izarravm-cpu/shadow-cache-probe", "izarravm-machine/shadow-cache-probe", "izarravm-bus/shadow-cache-probe"]

[dependencies]
clap.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
png.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
izarravm-audio = { path = "../izarravm-audio" }
izarravm-bus = { path = "../izarravm-bus" }
izarravm-cdaudio = { path = "../izarravm-cdaudio" }
izarravm-core = { path = "../izarravm-core" }
izarravm-cpu = { path = "../izarravm-cpu", default-features = false }
izarravm-firmware = { path = "../izarravm-firmware" }
izarravm-input = { path = "../izarravm-input" }
izarravm-machine = { path = "../izarravm-machine", default-features = false }
izarravm-video = { path = "../izarravm-video" }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3.45", default-features = false, features = ["std", "local-offset"] }
toml.workspace = true

[target.'cfg(windows)'.dependencies]
# Raw Input FFI for the WM_INPUT mouse hook that keeps a high-polling-rate mouse
# from flooding winit's event pump. Matches the version winit already pulls in.
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    # GetConsoleWindow: the AVX2 preflight uses it to decide whether a modal
    # message box is reachable (no console) or would hang a headless run
    # (console attached, so stderr already reaches someone).
    "Win32_System_Console",
    # Temporary riprofile sampler (suspend/GetThreadContext + dbghelp).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
